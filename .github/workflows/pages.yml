name: Deploy Diet page

on:
  push:
    branches: [ccr-c0a6bca3-fu3lns, ccr-15eef771-tkwt8m, main]
    paths:
      - data/log.json
      - site/**
      - scripts/build_site.py
      - scripts/diet_core.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '5 19 * * *'   # 매일 04:05 KST, 기록이 없어도 새 날짜 칸이 생기게 다시 배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site data
        run: python3 scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
