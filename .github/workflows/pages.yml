name: Deploy Diet page

on:
  push:
    branches: ['**']   # 어느 브랜치로 푸시해도 배포
    paths:
      - data/log.json
      - site/**
      - scripts/build_site.py
      - scripts/diet_core.py
      - .github/workflows/pages.yml
  workflow_dispatch:
  schedule:
    - cron: '5 19 * * *'   # 매일 04:05 KST, 기록이 없어도 새 날짜 칸이 생기게 다시 배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 빌드와 배포를 다른 job으로 나눈다. 같은 job에서 업로드 직후 바로 배포하면
  # 아티팩트가 아직 조회되지 않아 첫 배포가 매번 "No artifacts named github-pages"로 실패했다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 세션마다 브랜치가 달라도 data/log.json이 가장 최근에 바뀐 브랜치를 배포한다
      # (예약 실행이나 오래된 브랜치 푸시가 옛 기록으로 덮어쓰지 않게)
      - name: Pick branch with newest log
        run: |
          best=""; bt=0
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep -v '/HEAD$'); do
            t=$(git log -1 --format=%ct "$b" -- data/log.json 2>/dev/null || echo 0)
            if [ "${t:-0}" -gt "$bt" ]; then bt=$t; best=$b; fi
          done
          echo "deploy from: $best"
          [ -n "$best" ] && git checkout -q --detach "$best"
      - name: Build site data
        run: python3 scripts/build_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # 깃허브 쪽 일시 오류에 대비해 한 번만 더 시도한다
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
