<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfect Abs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Perfect Abs</h1>
  <span><input type="date" id="date"> <button id="settings" aria-label="설정">⚙</button></span>
</header>
<main>
  <section class="card" id="summary">
    <h2>오늘 요약</h2>
    <div class="bar"><div id="kcalBar"></div></div>
    <p id="kcalText"></p>
    <div class="macros" id="macros"></div>
  </section>

  <section class="card">
    <h2>식단 추가</h2>
    <form id="form">
      <select id="meal"><option>아침</option><option selected>점심</option><option>저녁</option><option>간식</option></select>
      <input id="food" placeholder="음식" required>
      <input id="kcal" type="number" min="0" placeholder="kcal" required>
      <input id="carb" type="number" min="0" placeholder="탄(g)">
      <input id="protein" type="number" min="0" placeholder="단(g)">
      <input id="fat" type="number" min="0" placeholder="지(g)">
      <button>추가</button>
    </form>
    <table id="log"><thead><tr><th>끼니</th><th>음식</th><th>kcal</th><th>탄</th><th>단</th><th>지</th><th></th></tr></thead><tbody></tbody></table>
  </section>

  <section class="card">
    <h2>주간 요약</h2>
    <svg id="chart" viewBox="0 0 350 160" role="img" aria-label="최근 7일 칼로리"></svg>
  </section>

  <section class="card">
    <h2>프로필 · 목표</h2>
    <p>남 28세 · 181cm · 87kg (BMI 26.6) · 목표: 체지방 감량 + 근육 유지</p>
    <p>BMR 1,866 · TDEE 2,800 · 하루 목표 <b>2,350 kcal</b> (유지 −450)</p>
    <p class="note" id="status"></p>
    <p class="note">외식·배달은 평균 추정치라 오차 ±10% 내외. 2주 기록 후 체중 변화로 목표 조정.</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
