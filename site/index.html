<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>Diet</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 요즘 대시보드: 어두운 면 + 얇은 경계선 + 링/면적 차트. 색은 항목마다 고정(칼로리 초록·단백질 노랑·탄수 청록·지방 보라·초과 빨강). */
:root{
  --bg:#0a0a0d; --s1:#131318; --s2:#1b1b22; --line:rgba(255,255,255,.09);
  --fg:#f5f5f7; --sub:#a1a1ab; --mut:#6c6c78;
  --kcal:#4ade80; --pro:#facc15; --carb:#22d3ee; --fat:#c084fc; --over:#ff5a5f;
  --num:"Inter","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR","Inter",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--body)}
body{padding:0 14px calc(28px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:800 20px var(--num);letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--kcal)}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--sub);font:500 13px var(--body);padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--fg);color:#000;font-weight:700}

.datebar{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;margin:6px 0 10px}
.datebar button{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--s1);color:var(--fg);font:500 17px var(--body);cursor:pointer}
.datebar button:disabled{opacity:.3}
.dt{text-align:center;line-height:1.25}
.dt b{display:block;font:700 16px var(--body)}
.dt span{font-size:12px;color:var(--sub)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.lbl{font-size:12px;color:var(--sub);font-weight:500;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

/* 칼로리 히어로 */
.hero{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .c b{font:800 30px/1 var(--num);letter-spacing:-.03em}
.ring .c span{font-size:11px;color:var(--sub);margin-top:2px}
.hs{flex:1;display:grid;gap:8px}
.hs div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:7px}
.hs div:last-child{border:0;padding:0}
.hs span{color:var(--sub);font-size:13px}
.hs b{font:700 17px var(--num)}

/* 단백질 */
.big{display:flex;align-items:baseline;gap:6px}
.big b{font:800 40px/1 var(--num);letter-spacing:-.03em}
.big small{font:500 14px var(--num);color:var(--sub)}
.bar{height:10px;border-radius:99px;background:var(--s2);margin:10px 0 7px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.bar.sm{height:7px;margin:8px 0 6px}
.note{font-size:13px;color:var(--sub)}
.note b{color:var(--fg);font-weight:700}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 .card{margin:0;padding:12px}
.tile b.v{font:800 24px/1.1 var(--num);letter-spacing:-.03em}
.tile small{font:500 12px var(--num);color:var(--sub);margin-left:3px}
.sub{font-size:12px;color:var(--sub);margin-top:2px}
.warn{color:var(--over)!important}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font:500 10.5px var(--num);fill:var(--sub)}
.chart .v{fill:var(--fg);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.leg u{display:inline-block;width:14px;border-top:2px dashed #fff;margin-right:6px;vertical-align:3px;opacity:.8}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}
.cal .w{font-size:11px;color:var(--mut);text-align:center;padding-bottom:2px}
.cd{position:relative;min-height:52px;border-radius:9px;background:var(--s2);border:1px solid transparent;color:var(--fg);padding:5px 5px 0;text-align:left;font-family:var(--num);cursor:pointer;overflow:hidden}
.cd.blank{background:none;cursor:default}
.cd.none{background:none;border:1px dashed var(--line);cursor:default;color:var(--mut)}
.cd .d{display:block;font:500 10px var(--num);color:var(--sub)}
.cd .k{display:block;font:700 12px var(--num);margin-top:1px;letter-spacing:-.04em}
.cd .p{position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:2px;background:rgba(255,255,255,.12)}
.cd .p i{display:block;height:100%;border-radius:2px;background:var(--pro)}
.cd.ok{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.35)}
.cd.hi{background:rgba(255,90,95,.18);border-color:rgba(255,90,95,.45)}
.cd.today{border-color:var(--fg)}

/* 맨 위 블록: 채팅 대시보드와 같은 3줄 형식 */
.board{padding:6px 14px 12px}
.it{padding:11px 0}
.it+.it{border-top:1px solid var(--line)}
.board .lbl{margin:8px 0 0}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.l1 span{font-weight:700}
.l1 b{font-weight:800}
.l1 small{font:500 12.5px var(--num);color:var(--sub);margin-left:4px;letter-spacing:0}
.cells{display:flex;gap:3px;margin:7px 0 6px}
.cells i{flex:1;height:12px;border-radius:3px;background:var(--s2)}
.cells i.g{margin-left:6px}
.l3{font-size:13px;color:var(--sub)}
.l3 b{color:var(--fg);font-weight:700}
.xl .l1 span{font-size:16px}.xl .l1 b{font-size:30px}.xl .cells i{height:18px}.xl .l3{font-size:14px}
.lg .l1 span{font-size:15px}.lg .l1 b{font-size:24px}.lg .cells i{height:14px}
.md .l1 span{font-size:14px}.md .l1 b{font-size:19px}.md .cells i{height:9px}.md .l3{font-size:12.5px}
.carry{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.carry span{display:block;font-size:12px;color:var(--sub)}
.carry b{font-size:19px;font-weight:800}
.carry small{display:block;font-size:11.5px;color:var(--sub)}

.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tiles3 .card{margin:0;padding:11px}
.tiles3 span{display:block;font-size:11.5px;color:var(--sub)}
.tiles3 b{display:block;font:800 19px/1.25 var(--num);letter-spacing:-.03em}

.empty{padding:40px 0;text-align:center;color:var(--sub)}
footer{margin-top:16px;text-align:center;font-size:11.5px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Diet<i>.</i></div>
    <nav class="seg" id="tabs">
      <button class="on" data-t="day">일간</button>
      <button data-t="week">주간</button>
      <button data-t="month">월간</button>
      <button data-t="trend">추이</button>
    </nav>
  </div>
</header>
<main id="view"></main>
<footer id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const dayLabel = s => { const d = parse(s); return `${d.getMonth()+1}.${d.getDate()}`; };

let DATA, BY = {}, GOAL, DD = '';
const S = { tab:'day', date:null };
const lastD = () => DATA.days[DATA.days.length-1].d;
const live = x => x.d === lastD() && x.d === iso(new Date());   // 오늘 진행 중
const fin = a => { const f = a.filter(x => !live(x)); return f.length ? f : a; };

fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(d => {
  DATA = d; GOAL = d.goal; d.days.forEach(x => BY[x.d] = x);
  S.date = lastD();
  const left = Math.ceil((parse(d.targetDate) - new Date(new Date().toDateString())) / 864e5);
  DD = `D-${Math.max(0,left)} 복근`;
  $('#foot').textContent = `업데이트 ${d.updated.replace('T',' ').slice(0,16)}`;
  render();
}).catch(() => { $('#view').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>'; });

function syncTabs(){ document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab)); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; syncTabs(); render(); scrollTo({top:0}); });
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  if (a === 'day') { S.date = v; S.tab = 'day'; syncTabs(); scrollTo({top:0}); }
  if (a === 'dnav') S.date = addDays(S.date, +v);
  render();
});

/* ---------- 조각 ---------- */
// 채팅 대시보드와 같은 3줄 형식: 항목·수치 / 칸 막대(목표=12칸, 넘으면 길어짐) / 퍼센트 · 남음
function cells(v, goal, col, more){
  const n = Math.round(12*v/goal), N = clamp(Math.max(12,n), 12, 24), f = Math.min(n, N), c = (v > goal && !more) ? 'var(--over)' : col;
  let s = ''; for (let i=0;i<N;i++) s += `<i${i<f?` style="background:${c}"`:''}${i===12?' class="g"':''}></i>`;
  return `<div class="cells">${s}</div>`;
}
function line(name, col, v, goal, unit, size, more){
  const pct = v/goal*100, left = goal - v, over = left < 0 && !more;
  const msg = more && left < 0 ? `달성 +${fmt(-left)}${unit}` : left < 0 ? `초과 ${fmt(-left)}${unit}` : `남음 ${fmt(left)}${unit}`;
  return `<div class="it ${size}"><div class="l1"><span><i class="dot" style="background:${col}"></i>${name}</span><b class="n">${fmt(v)}<small>/ ${fmt(goal)} ${unit}</small></b></div>
  ${cells(v, goal, col, more)}<div class="l3 ${over?'warn':''}"><b>${fmt(pct)}%</b> · ${msg}</div></div>`;
}
function topBlock(o, title){
  return `<section class="card board">${title?`<div class="lbl">${title}</div>`:''}
  ${line('칼로리','var(--kcal)', o.kcal, o.kGoal, 'kcal', 'xl')}${line('단백질','var(--pro)', o.p, GOAL.protein, 'g', 'lg', true)}
  ${line('탄수화물','var(--carb)', o.c, o.cGoal, 'g', 'md')}${line('지방','var(--fat)', o.f, GOAL.fat, 'g', 'md')}
  ${o.carry!=null?`<div class="carry"><div><span>초과</span><b class="n ${o.over>0?'warn':''}">${fmt(o.over)}kcal</b></div><div><span>누적</span><b class="n">${fmt(o.carry)}kcal</b><small>초과 ${fmt(o.over)} + 쌓인 것 ${fmt(o.carry-o.over)}</small></div></div>`:''}</section>`;
}
const dayObj = d => ({kcal:d.net, kGoal:d.goal, p:d.protein, c:d.carb, cGoal:d.carbGoal, f:d.fat, over:d.over, carry:d.carry});
const avgObj = a => ({kcal:avg(a.map(x=>x.net)), kGoal:avg(a.map(x=>x.goal)), p:avg(a.map(x=>x.protein)), c:avg(a.map(x=>x.carb)), cGoal:avg(a.map(x=>x.carbGoal)), f:avg(a.map(x=>x.fat))});
function statTiles(a, digits){
  const defi = a.reduce((s,x)=>s+(2200-x.net),0);
  return `<div class="tiles3"><div class="card"><span>누적 적자</span><b>${defi>=0?'−':'+'}${fmt(Math.abs(defi))}</b></div><div class="card"><span>추정 감량</span><b>${(defi/7700).toFixed(digits)}kg</b></div><div class="card"><span>기록</span><b>${a.length}일</b></div></div>`;
}

// 세로 막대: 윗부분 둥근 막대, 흰 점선 = 그날 목표
function barsChart({days, vals, goals, color, h=170}){
  const W = 340, top = 24, bot = 30, n = days.length;
  const mx = Math.max(...vals.filter(v=>v!=null), ...goals.filter(g=>g!=null), 1) * 1.1;
  const y = v => top + (h-top-bot) * (1 - v/mx), bw = W/n, w = Math.min(34, bw*.62);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}">`;
  [0,.5,1].forEach(f => s += `<line class="grid" x1="0" x2="${W}" y1="${y(mx/1.1*f)}" y2="${y(mx/1.1*f)}"/>`);
  days.forEach((d,i) => {
    const v = vals[i], g = goals[i], cx = i*bw + bw/2, x = cx - w/2, dt = parse(d);
    if (v != null && v > 0) {
      const yy = y(v), hh = y(0)-yy, r = Math.min(7, w/2, hh);
      s += `<path d="M${x} ${y(0)}V${yy+r}Q${x} ${yy} ${x+r} ${yy}H${x+w-r}Q${x+w} ${yy} ${x+w} ${yy+r}V${y(0)}Z" fill="${color(v,i)}" data-act="day:${d}" style="cursor:pointer"/>`;
      s += `<text class="v" x="${cx}" y="${Math.min(yy, g!=null?y(g):99)-8}" text-anchor="middle">${fmt(v)}</text>`;
    }
    if (g != null) s += `<line x1="${x-4}" x2="${x+w+4}" y1="${y(g)}" y2="${y(g)}" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 3" opacity=".9"/>`;
    s += `<text x="${cx}" y="${h-14}" text-anchor="middle">${WD[dt.getDay()]}</text><text x="${cx}" y="${h-2}" text-anchor="middle" style="fill:var(--mut)">${dt.getDate()}</text>`;
  });
  return s + '</svg>';
}

// 부드러운 면적 선 그래프 (없는 날은 선이 끊긴다)
function areaChart({days, series, goal=null, h=170}){
  const W = 340, pl = 34, pr = 6, top = 12, bot = 22, n = days.length;
  const all = series.flatMap(q => q.v.filter(v=>v!=null)).concat(goal ? [goal] : []);
  const mx = Math.ceil(Math.max(...all, 1)*1.12/100)*100;
  const x = i => pl + (n===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(n-1)), y = v => top + (h-top-bot)*(1-v/mx);
  const id = 'g' + Math.random().toString(36).slice(2,7);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}"><defs>${series.map((q,k)=>`<linearGradient id="${id}${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${q.color}" stop-opacity=".32"/><stop offset="1" stop-color="${q.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  for (let k=0;k<=3;k++){ const v = mx*k/3; s += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end">${fmt(v)}</text>`; }
  if (goal) s += `<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="#fff" stroke-width="1.4" stroke-dasharray="4 4" opacity=".75"/>`;
  series.forEach((q,k) => {
    const segs = []; let cur = [];
    q.v.forEach((v,i) => { if (v==null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) segs.push(cur);
    segs.forEach(pts => {
      let d = `M${pts[0][0]} ${pts[0][1]}`;
      for (let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i],cx=(x0+x1)/2; d += `C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`; }
      if (q.area && pts.length>1) s += `<path d="${d}L${pts[pts.length-1][0]} ${y(0)}L${pts[0][0]} ${y(0)}Z" fill="url(#${id}${k})"/>`;
      s += `<path d="${d}" fill="none" stroke="${q.color}" stroke-width="${q.w||2.4}" stroke-linecap="round" stroke-linejoin="round" ${q.faint?'opacity=".45"':''}/>`;
      if (q.dots) pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${q.color}"/>`);
    });
    const li = q.v.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
    if (li != null && q.endDot !== false) s += `<circle cx="${x(li)}" cy="${y(q.v[li])}" r="4.5" fill="${q.color}" stroke="#131318" stroke-width="2.5"/>`;
  });
  const idx = n<=6 ? [...Array(n).keys()] : [0, Math.floor((n-1)/2), n-1];
  idx.forEach(i => s += `<text x="${x(i)}" y="${h-4}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${dayLabel(days[i])}</text>`);
  return s + '</svg>';
}
const kcalColor = (v, g) => v > g ? 'var(--over)' : 'var(--kcal)';
const legK = '<div class="leg"><span><i style="background:var(--kcal)"></i>목표 이내</span><span><i style="background:var(--over)"></i>초과</span><span><u></u>그날 목표</span></div>';
const legP = '<div class="leg"><span><i style="background:var(--pro)"></i>단백질</span><span><u></u>목표 170g</span></div>';

/* ---------- 일간 ---------- */
function viewDay(){
  const d = BY[S.date], dt = parse(S.date), idx = DATA.days.findIndex(x => x.d === S.date), o = dayObj(d);
  let h = `<div class="datebar"><button data-act="dnav:-1" ${idx>0?'':'disabled'} aria-label="이전 날">‹</button>
    <div class="dt"><b>${dt.getMonth()+1}월 ${dt.getDate()}일 ${WD[dt.getDay()]}요일</b><span>${live(d)?'오늘 · 진행 중':'기록 완료'}${d.burn?` · 운동 −${fmt(d.burn)}kcal`:''} · ${DD}</span></div>
    <button data-act="dnav:1" ${idx<DATA.days.length-1?'':'disabled'} aria-label="다음 날">›</button></div>`;
  h += topBlock(o);
  const w = DATA.days.slice(Math.max(0, idx-6), idx+1), dd = w.map(x=>x.d);
  h += `<section class="card"><div class="lbl">최근 7일 · 칼로리 (순섭취)</div>${barsChart({days:dd, vals:w.map(x=>x.net), goals:w.map(x=>x.goal), color:(v,i)=>kcalColor(v,w[i].goal)})}${legK}</section>`;
  h += `<section class="card"><div class="lbl">최근 7일 · 단백질 (g)</div>${barsChart({days:dd, vals:w.map(x=>x.protein), goals:w.map(()=>GOAL.protein), color:()=>'var(--pro)'})}${legP}</section>`;
  return h;
}

/* ---------- 주간: 최근 7일 ---------- */
function viewWeek(){
  const end = lastD(), days = [...Array(7).keys()].map(i => addDays(end, i-6));
  const rs = days.map(s => BY[s] || null), have = rs.filter(Boolean);
  let h = `<div class="datebar" style="grid-template-columns:1fr"><div class="dt"><b>최근 7일</b><span>${dayLabel(days[0])} – ${dayLabel(days[6])} · ${have.length}일 기록${have.some(live)?' · 오늘 제외 평균':''}</span></div></div>`;
  if (!have.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const fh = fin(have), o = avgObj(fh);
  h += topBlock(o, `일평균 · ${fh.length}일 기준`) + statTiles(fh, 2);
  h += `<section class="card"><div class="lbl">일별 칼로리 (순섭취)</div>${barsChart({days, vals:rs.map(x=>x?x.net:null), goals:rs.map(x=>x?x.goal:null), color:(v,i)=>kcalColor(v,rs[i].goal)})}${legK}</section>`;
  h += `<section class="card"><div class="lbl">일별 단백질 (g)</div>${barsChart({days, vals:rs.map(x=>x?x.protein:null), goals:days.map(()=>GOAL.protein), color:()=>'var(--pro)'})}${legP}</section>`;
  return h;
}

/* ---------- 월간: 최근 30일 ---------- */
function viewMonth(){
  const end = lastD(), days = [...Array(30).keys()].map(i => addDays(end, i-29)), md = days.map(s=>BY[s]).filter(Boolean);
  let h = `<div class="datebar" style="grid-template-columns:1fr"><div class="dt"><b>최근 30일</b><span>${dayLabel(days[0])} – ${dayLabel(days[29])} · ${md.length}일 기록${md.some(live)?' · 오늘 제외 평균':''}</span></div></div>`;
  if (!md.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const fm = fin(md), o = avgObj(fm);
  h += topBlock(o, `일평균 · ${fm.length}일 기준`) + statTiles(fm, 1);
  let cal = '<div class="cal">' + WD.map(w=>`<div class="w">${w}</div>`).join('') + '<div class="cd blank"></div>'.repeat(parse(days[0]).getDay());
  days.forEach((s,i) => {
    const x = BY[s], dd = parse(s), lab = (i===0 || dd.getDate()===1) ? `${dd.getMonth()+1}/${dd.getDate()}` : dd.getDate();
    if (!x) { cal += `<div class="cd none"><span class="d">${lab}</span></div>`; return; }
    cal += `<button class="cd ${x.net>x.goal?'hi':'ok'} ${live(x)?'today':''}" data-act="day:${s}"><span class="d">${lab}</span><span class="k">${fmt(x.net)}</span><span class="p"><i style="width:${clamp(x.protein/GOAL.protein*100,0,100)}%"></i></span></button>`;
  });
  h += `<section class="card"><div class="lbl">달력 · 순섭취 kcal</div>${cal}</div><div class="leg"><span><i style="background:rgba(74,222,128,.5)"></i>목표 이내</span><span><i style="background:rgba(255,90,95,.6)"></i>초과</span><span><i style="background:var(--pro)"></i>아래 선 = 단백질</span></div></section>`;
  h += `<section class="card"><div class="lbl">일별 칼로리 추이</div>${areaChart({days, series:[{v:days.map(s=>BY[s]?BY[s].net:null), color:'#4ade80', area:true, dots:true}], goal:GOAL.kcal})}<div class="leg"><span><u></u>목표 ${fmt(GOAL.kcal)}</span></div></section>`;
  h += `<section class="card"><div class="lbl">일별 단백질 추이 (g)</div>${areaChart({days, series:[{v:days.map(s=>BY[s]?BY[s].protein:null), color:'#facc15', area:true, dots:true}], goal:GOAL.protein})}<div class="leg"><span><u></u>목표 ${GOAL.protein}g</span></div></section>`;
  return h;
}

/* ---------- 추이 ---------- */
function ma(arr, k=7){ return arr.map((_,i)=> avg(arr.slice(Math.max(0,i-k+1), i+1))); }
function viewTrend(){
  const ds = DATA.days, L = live(ds[ds.length-1]) ? 1 : 0, dd = ds.map(x=>x.d);
  const maF = a => ma(a.slice(0, a.length-L)).concat(Array(L).fill(null)), last = a => a.filter(v=>v!=null).pop();
  const net = ds.map(x=>x.net), pro = ds.map(x=>x.protein), net7 = maF(net), pro7 = maF(pro);
  let h = `<div class="datebar" style="grid-template-columns:1fr"><div class="dt"><b>전체 추이</b><span>${dayLabel(dd[0])} – ${dayLabel(dd[dd.length-1])} · ${ds.length}일${L?' · 7일 평균은 오늘 제외':''}</span></div></div>`;
  const k = last(net7), kc = k > GOAL.kcal ? 'var(--over)' : 'var(--kcal)';
  h += `<section class="card"><div class="lbl"><span><i class="dot" style="background:${kc}"></i>칼로리 · 7일 평균</span><span class="n">목표 ${fmt(GOAL.kcal)}</span></div><div class="big"><b style="color:${kc}">${fmt(k)}</b><small>kcal</small></div>
    ${areaChart({days:dd, series:[{v:net, color:'#ffffff', faint:true, w:1.6, endDot:false}, {v:net7, color:k>GOAL.kcal?'#ff5a5f':'#4ade80', area:true, w:2.8}], goal:GOAL.kcal})}
    <div class="leg"><span><i style="background:${kc}"></i>7일 평균</span><span><i style="background:#fff;opacity:.5"></i>일별</span><span><u></u>목표</span></div></section>`;
  h += `<section class="card"><div class="lbl"><span><i class="dot" style="background:var(--pro)"></i>단백질 · 7일 평균</span><span class="n">목표 ${GOAL.protein}g</span></div><div class="big"><b style="color:var(--pro)">${fmt(last(pro7))}</b><small>g</small></div>
    ${areaChart({days:dd, series:[{v:pro, color:'#ffffff', faint:true, w:1.6, endDot:false}, {v:pro7, color:'#facc15', area:true, w:2.8}], goal:GOAL.protein})}
    <div class="leg"><span><i style="background:var(--pro)"></i>7일 평균</span><span><i style="background:#fff;opacity:.5"></i>일별</span><span><u></u>목표</span></div></section>`;
  h += `<section class="card"><div class="lbl">탄수화물 · 지방 (g)</div>${areaChart({days:dd, series:[{v:ds.map(x=>x.carb), color:'#22d3ee'}, {v:ds.map(x=>x.fat), color:'#c084fc'}]})}
    <div class="leg"><span><i style="background:var(--carb)"></i>탄수화물</span><span><i style="background:var(--fat)"></i>지방</span></div></section>`;
  return h;
}

function render(){ $('#view').innerHTML = {day:viewDay, week:viewWeek, month:viewMonth, trend:viewTrend}[S.tab](); }
</script>
</body>
