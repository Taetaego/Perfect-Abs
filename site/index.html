<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Diet</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Diet">
<style>
/* 옛날 HTML 느낌: 검정 바탕, 기본 글꼴(맑은 고딕/굴림), 글자 막대, 선 표, 밑줄 링크. 장식 없음. */
:root{--bg:#000;--fg:#ddd;--w:#fff;--y:#ff0;--r:#f33;--g:#0f0;--c:#0ff;--m:#f0f;--b:#6cf;--e:#3a3a3a;--line:#777}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Malgun Gothic","맑은 고딕","Gulim","굴림체","Noto Sans KR",sans-serif}
body{padding:8px 10px calc(30px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0;color:var(--w);letter-spacing:.1em}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
b{color:var(--w)}
.lnk{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--b);text-decoration:underline;cursor:pointer}
.lnk.on{color:#000;background:var(--w);text-decoration:none;padding:0 2px}
.lnk:disabled{color:#555;text-decoration:none;cursor:default}
.tabs{margin:4px 0}
.date{margin:6px 0;text-align:center}
.item{margin:10px 0}
.l1{display:flex;justify-content:space-between;gap:8px}
.bar{font:12px/1.1 "Gulim","굴림체","Courier New",monospace;white-space:pre;letter-spacing:0;margin:3px 0;overflow:hidden}
.bar .k{color:var(--g)}.bar .c{color:var(--c)}.bar .t{color:var(--m)}.bar .e{color:var(--e)}.bar .o{color:var(--r)}.bar .p{color:var(--y)}.bar .m{color:var(--w)}
.red{color:var(--r)}.yel{color:var(--y)}
.pro{color:var(--y)}.k{color:var(--g)}.c{color:var(--c)}.t{color:var(--m)}
table{border-collapse:collapse;width:100%;margin:6px 0}
th,td{border:1px solid var(--line);padding:2px 6px;text-align:right;font-weight:400}
th{color:var(--w);text-align:center}
td.l,th.l{text-align:left}
.box{border:1px solid var(--line);padding:4px 8px;margin:8px 0}
.vc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-top:8px}
.vc.many{gap:2px}
.col{position:relative;display:flex;flex-direction:column;align-items:stretch;cursor:pointer}
.vl{text-align:center;font-size:11px;height:16px;white-space:nowrap;color:var(--w)}
.segs{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:34px;margin:0 auto}
.vc.many .segs{max-width:none}
.seg{display:block;height:9px;background:#222}
.seg.k{background:var(--g)}.seg.o{background:var(--r)}.seg.p{background:var(--y)}
.seg.g{border-top:3px solid #fff}
.xl{text-align:center;font-size:11px;line-height:1.2;color:#aaa;margin-top:4px;min-height:26px}
.vc.many .xl{min-height:16px}
.xl.abs{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);white-space:nowrap;min-height:0}
.vc.many{margin-bottom:22px}
.legend{color:#999;font-size:12px;margin-top:4px}
.empty{padding:30px 0;text-align:center;color:#999}
footer{margin-top:14px;color:#777;font-size:12px;text-align:center}
</style>
</head>
<body>
<h1>DIET</h1>
<div class="tabs" id="tabs">
  <button class="lnk on" data-t="day">[일간]</button>
  <button class="lnk" data-t="week">[주간]</button>
  <button class="lnk" data-t="month">[월간]</button>
  <button class="lnk" data-t="trend">[추이]</button>
  <button class="lnk" data-t="body">[몸]</button>
</div>
<hr>
<main id="view"></main>
<footer id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const dayLabel = s => { const d = parse(s); return `${d.getMonth()+1}.${d.getDate()}`; };

let DATA, BY = {}, GOAL, DD = '';
const S = { tab:'day', date:null };
const lastD = () => DATA.days[DATA.days.length-1].d;
const live = x => x.d === lastD() && x.d === iso(new Date());   // 오늘 진행 중
const fin = a => { const f = a.filter(x => !live(x)); return f.length ? f : a; };

const TABS = ['day','week','month','trend','body'];
function load(d){
  DATA = d; GOAL = d.goal; BY = {}; d.days.forEach(x => BY[x.d] = x);
  if (!S.date || !BY[S.date]) S.date = lastD();
  const left = Math.ceil((parse(d.targetDate) - new Date(new Date().toDateString())) / 864e5);
  DD = `D-${Math.max(0,left)} 복근`;
  const tot = (parse(d.targetDate) - parse(d.startDate)) / 864e5, gone = clamp((new Date(new Date().toDateString()) - parse(d.startDate)) / 864e5, 0, tot);
  TP = Math.round(gone/tot*100);
  $('#foot').textContent = `업데이트 ${d.updated.replace('T',' ').slice(0,16)}`;
}
let TP = 0;
function applyHash(){
  const m = location.hash.slice(1).split('/');
  if (TABS.includes(m[0])) S.tab = m[0];
  if (m[0] === 'day' && m[1] && BY[m[1]]) S.date = m[1];
  syncTabs();
}
function setHash(){ const t = '#' + S.tab + (S.tab==='day' ? '/' + S.date : ''); if (location.hash !== t) history.replaceState(null, '', t); }
async function refresh(){ try { const d = await (await fetch('data.json', {cache:'no-store'})).json(); if (d.updated !== DATA.updated) { load(d); render(); } } catch(e) {} }
fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(d => { load(d); applyHash(); render(); })
  .catch(() => { $('#view').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>'; });
document.addEventListener('visibilitychange', () => { if (!document.hidden && DATA) refresh(); });
setInterval(() => { if (!document.hidden && DATA) refresh(); }, 300000);
window.addEventListener('hashchange', () => { if (DATA) { applyHash(); render(); } });
// 일간 화면에서 좌우로 밀면 전날/다음날
let tx = 0, ty = 0;
$('#view').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
$('#view').addEventListener('touchend', e => {
  if (S.tab !== 'day' || !DATA) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40) { const i = DATA.days.findIndex(x => x.d === S.date), n = DATA.days[i + (dx < 0 ? 1 : -1)]; if (n) { S.date = n.d; render(); } }
}, {passive:true});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

function syncTabs(){ document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab)); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; syncTabs(); render(); scrollTo({top:0}); });
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  if (a === 'day') { S.date = v; S.tab = 'day'; syncTabs(); scrollTo({top:0}); }
  if (a === 'dnav') S.date = addDays(S.date, +v);
  render();
});

/* ---------- 글자 막대 ---------- */
// 목표 = W칸. 넘으면 최대 2W칸까지 길어지고, 목표 지점에 | 표시.
function bar(v, goal, kind, W=22){
  const n = Math.round(W*v/goal), N = clamp(Math.max(W,n), W, 2*W), over = v > goal;
  const cls = kind === 'pro' ? 'p' : over ? 'o' : kind;
  let s = '';
  for (let i=0;i<N;i++){
    if (i === W && N > W) s += '<span class="m">|</span>';
    s += `<span class="${i<n?cls:'e'}">${i<n?'█':'░'}</span>`;
  }
  return s;
}
function item(tag, name, v, goal, unit, kind){
  const pct = v/goal*100, left = goal - v;
  const msg = kind==='pro' && left<0 ? `달성 +${fmt(-left)}${unit}` : left<0 ? `초과 ${fmt(-left)}${unit}` : `남음 ${fmt(left)}${unit}`;
  const c = kind==='pro' ? 'yel' : left<0 ? 'red' : kind;
  return `<div class="item"><div class="l1"><b class="${kind}">[${tag}] ${name}</b><span><b>${fmt(v)}</b> / ${fmt(goal)} ${unit}</span></div>
  <div class="bar">${bar(v, goal, kind)}</div><div class="${c}">${fmt(pct)}% · ${msg}</div></div>`;
}
function dash(o, title){
  return `<div class="box">${title?`<div>${title}</div>`:''}
  ${item('KCAL','칼로리', o.kcal, o.kGoal, 'kcal', 'k')}${item('PRO','단백질', o.p, GOAL.protein, 'g', 'pro')}
  ${item('CARB','탄수화물', o.c, o.cGoal, 'g', 'c')}${item('FAT','지방', o.f, GOAL.fat, 'g', 't')}
  ${o.carry!=null?`<hr><div class="l1"><span><b class="${o.over>0?'red':''}">[OVER]</b> 초과</span><b class="${o.over>0?'red':''}">${fmt(o.over)}kcal</b></div>
  <div class="l1"><span><b>[SUM]</b> 누적 <span style="color:#999">(초과 ${fmt(o.over)} + 쌓인 것 ${fmt(o.carry-o.over)})</span></span><b>${fmt(o.carry)}kcal</b></div>`:''}</div>`;
}
const dayObj = d => ({kcal:d.net, kGoal:d.goal, p:d.protein, c:d.carb, cGoal:d.carbGoal, f:d.fat, over:d.over, carry:d.carry});
const avgObj = a => ({kcal:avg(a.map(x=>x.net)), kGoal:avg(a.map(x=>x.goal)), p:avg(a.map(x=>x.protein)), c:avg(a.map(x=>x.carb)), cGoal:avg(a.map(x=>x.carbGoal)), f:avg(a.map(x=>x.fat))});
function miniStats(a, digits){
  const defi = a.reduce((s,x)=>s+(2200-x.net),0);
  return `<table><tr><th>누적 적자</th><th>추정 감량</th><th>기록</th></tr><tr><td>${defi>=0?'−':'+'}${fmt(Math.abs(defi))}kcal</td><td>${(defi/7700).toFixed(digits)}kg</td><td>${a.length}일</td></tr></table>`;
}

// 세로 칸 막대: 값이 클수록 네모 칸이 위로 쌓인다. 흰 윗줄 = 그날 목표.
function vchart({days, vals, goals, kind, H=12}){
  const n = days.length, many = n > 9;
  const mx = Math.max(...vals.filter(v=>v!=null), ...goals.filter(g=>g!=null), 1) * 1.08, unit = mx/H;
  let cols = '';
  days.forEach((s,i) => {
    const v = vals[i], g = goals[i];
    const fillN = v==null || v<=0 ? 0 : Math.max(1, Math.round(v/mx*H));
    const gi = g==null ? -1 : clamp(Math.round(g/mx*H), 1, H) - 1;
    const cls = kind==='pro' ? 'p' : (v!=null && v>g) ? 'o' : 'k';
    let segs = ''; for (let k=0;k<H;k++) segs += `<i class="seg${k<fillN?' '+cls:''}${k===gi?' g':''}"></i>`;
    const d = parse(s);
    const xl = !many ? `${WD[d.getDay()]}<br>${d.getDate()}` : ((n-1-i)%7===0 ? dayLabel(s) : '');
    cols += `<div class="col" data-act="day:${s}">${!many?`<span class="vl">${v==null?'-':fmt(v)}</span>`:''}<div class="segs">${segs}</div><span class="xl${many?' abs':''}">${xl}</span></div>`;
  });
  return `<div class="vc${many?' many':''}">${cols}</div><div class="legend">흰 줄=${kind==='pro'?'목표 170g':'그날 목표'} · 1칸≈ ${fmt(unit)}${kind==='pro'?'g':'kcal'}${kind==='pro'?' · 노랑=단백질':' · 초록=이내 · 빨강=초과'}</div>`;
}

/* ---------- 일간 ---------- */
function viewDay(){
  const d = BY[S.date], dt = parse(S.date), idx = DATA.days.findIndex(x => x.d === S.date);
  let h = `<div class="date"><button class="lnk" data-act="dnav:-1" ${idx>0?'':'disabled'}>[&lt;]</button>
    <b> ${S.date} (${WD[dt.getDay()]}) </b><button class="lnk" data-act="dnav:1" ${idx<DATA.days.length-1?'':'disabled'}>[&gt;]</button>
    <div style="color:#999;font-size:12px">${live(d)?'오늘 · 진행 중':'기록 완료'}${d.burn?` · 운동 −${fmt(d.burn)}kcal`:''} · ${DD} <span class="bar" style="display:inline;margin:0">${bar(TP,100,'k',10)}</span> ${TP}%</div></div>`;
  h += dash(dayObj(d)) + streakBox();
  const w = DATA.days.slice(Math.max(0, idx-6), idx+1), dd = w.map(x=>x.d);
  h += `<div class="box"><div>최근 7일 칼로리 (순섭취)</div>${vchart({days:dd, vals:w.map(x=>x.net), goals:w.map(x=>x.goal), kind:'k'})}</div>`;
  h += `<div class="box"><div>최근 7일 단백질 (g)</div>${vchart({days:dd, vals:w.map(x=>x.protein), goals:w.map(()=>GOAL.protein), kind:'pro'})}</div>`;
  return h;
}

/* ---------- 주간: 최근 7일 ---------- */
function viewWeek(){
  const end = lastD(), days = [...Array(7).keys()].map(i => addDays(end, i-6));
  const rs = days.map(s => BY[s] || null), have = rs.filter(Boolean);
  let h = `<div class="date"><b>최근 7일</b><div style="color:#999;font-size:12px">${dayLabel(days[0])} – ${dayLabel(days[6])} · ${have.length}일 기록${have.some(live)?' · 오늘 제외 평균':''}</div></div>`;
  if (!have.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const fh = fin(have);
  h += dash(avgObj(fh), `일평균 (${fh.length}일 기준)`) + miniStats(fh, 2);
  h += `<div class="box"><div>일별 칼로리 (순섭취)</div>${vchart({days, vals:rs.map(x=>x?x.net:null), goals:rs.map(x=>x?x.goal:GOAL.kcal), kind:'k'})}</div>`;
  h += `<div class="box"><div>일별 단백질 (g)</div>${vchart({days, vals:rs.map(x=>x?x.protein:null), goals:days.map(()=>GOAL.protein), kind:'pro'})}</div>`;
  return h;
}

/* ---------- 월간: 최근 30일 ---------- */
function viewMonth(){
  const end = lastD(), days = [...Array(30).keys()].map(i => addDays(end, i-29)), md = days.map(s=>BY[s]).filter(Boolean);
  let h = `<div class="date"><b>최근 30일</b><div style="color:#999;font-size:12px">${dayLabel(days[0])} – ${dayLabel(days[29])} · ${md.length}일 기록${md.some(live)?' · 오늘 제외 평균':''}</div></div>`;
  if (!md.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const fm = fin(md);
  h += dash(avgObj(fm), `일평균 (${fm.length}일 기준)`) + miniStats(fm, 1);
  h += `<div class="box"><div>일별 칼로리 (순섭취)</div>${vchart({days, vals:days.map(s=>BY[s]?BY[s].net:null), goals:days.map(s=>BY[s]?BY[s].goal:null), kind:'k'})}</div>`;
  h += `<div class="box"><div>일별 단백질 (g)</div>${vchart({days, vals:days.map(s=>BY[s]?BY[s].protein:null), goals:days.map(()=>GOAL.protein), kind:'pro'})}</div>`;
  h += `<table><tr><th class="l">날짜</th><th>순섭취</th><th>목표</th><th>단백질</th></tr>` +
    md.slice().reverse().map(x => `<tr><td class="l"><a class="lnk" data-act="day:${x.d}">${dayLabel(x.d)}(${WD[parse(x.d).getDay()]})</a></td>
      <td class="${x.net>x.goal?'red':'k'}">${fmt(x.net)}</td><td>${fmt(x.goal)}</td><td class="${x.protein>=GOAL.protein*.95?'yel':''}">${fmt(x.protein)}</td></tr>`).join('') +
    `</table><div class="legend">초록 = 목표 이내 · 빨강 = 초과 · 노랑 = 단백질 목표 달성(95%↑)</div>`;
  return h;
}

/* ---------- 추이 ---------- */
function ma(arr, k=7){ return arr.map((_,i)=> avg(arr.slice(Math.max(0,i-k+1), i+1))); }
function viewTrend(){
  const ds = DATA.days.slice(-30), L = live(ds[ds.length-1]) ? 1 : 0, dd = ds.map(x=>x.d);
  const maF = a => ma(a.slice(0, a.length-L)).concat(Array(L).fill(null));
  const net7 = maF(ds.map(x=>x.net)), pro7 = maF(ds.map(x=>x.protein));
  let h = `<div class="date"><b>추이 (7일 평균)</b><div style="color:#999;font-size:12px">${dayLabel(dd[0])} – ${dayLabel(dd[dd.length-1])} · ${ds.length}일${L?' · 오늘 제외':''}</div></div>`;
  h += `<div class="box"><div>칼로리 7일 평균 (순섭취)</div>${vchart({days:dd, vals:net7, goals:dd.map(()=>GOAL.kcal), kind:'k'})}</div>`;
  h += `<div class="box"><div>단백질 7일 평균 (g)</div>${vchart({days:dd, vals:pro7, goals:dd.map(()=>GOAL.protein), kind:'pro'})}</div>`;
  return h;
}

/* ---------- 연속 기록 ---------- */
function streakBox(){
  const done = DATA.days.filter(x => !live(x));
  const run = f => { let n = 0; for (let i = done.length-1; i >= 0 && f(done[i]); i--) n++; return n; };
  let rec = 0; for (let i = DATA.days.length-1; i >= 0; i--) { if (DATA.days[i].d === addDays(lastD(), -rec)) rec++; else break; }
  const p = run(x => x.protein >= GOAL.protein*.95), k = run(x => x.net <= x.goal);
  return `<div class="box"><div class="l1"><span><b>[STREAK]</b> 연속 (어제까지)</span></div>
  <div class="l1"><span class="pro">단백질 목표 달성</span><b class="pro">${p}일</b></div>
  <div class="l1"><span class="k">칼로리 목표 이내</span><b class="k">${k}일</b></div>
  <div class="l1"><span>기록</span><b>${rec}일</b></div></div>`;
}

/* ---------- 몸: 인바디·체중 + 목표 도달 예측 ---------- */
const f1 = n => n == null ? '-' : Number(n).toFixed(1);
function viewBody(){
  const B = DATA.body || [], tf = DATA.targetFatPct;
  let h = `<div class="date"><b>몸 (체성분)</b><div style="color:#999;font-size:12px">인바디·체중 ${B.length}건 · 목표 체지방률 ${tf}% · ${DD}</div></div>`;
  if (!B.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const cur = B[B.length-1], first = B[0];
  const lean = (B.slice().reverse().find(r => r.leanKg) || {}).leanKg;
  const tw = lean ? lean / (1 - tf/100) : null;
  const curFatKg = cur.fatKg != null ? cur.fatKg : (cur.fatPct != null ? cur.weight*cur.fatPct/100 : null);
  const dn = fin(DATA.days).slice(-7), defi = avg(dn.map(x => DATA.maintenance - x.net)), perDay = defi/7700;
  const today = iso(new Date());
  // 진행 항목 (채팅 대시보드와 같은 3줄 형식)
  const prog = (tag, name, now, start, target, unit, cls) => {
    const tot = start - target, done = start - now, pct = tot > 0 ? clamp(done/tot*100, 0, 100) : 0;
    return `<div class="item"><div class="l1"><b class="${cls}">[${tag}] ${name}</b><span><b>${f1(now)}</b> → ${f1(target)} ${unit}</span></div>
    <div class="bar">${bar(pct, 100, cls, 22)}</div><div class="${cls}">${Math.round(pct)}% · 남음 ${f1(Math.max(0, now-target))}${unit} <span style="color:#999">(시작 ${f1(start)})</span></div></div>`;
  };
  h += `<div class="box">${tw ? prog('WEIGHT','체중', cur.weight, first.weight, tw, 'kg', 'c') : ''}${cur.fatPct != null && first.fatPct != null ? prog('FAT%','체지방률', cur.fatPct, first.fatPct, tf, '%', 't') : ''}</div>`;
  // 예측
  if (tw) {
    const R = cur.weight - tw, daysTo = (parse(DATA.targetDate) - parse(cur.d)) / 864e5;
    const projW = cur.weight - perDay*daysTo, projFat = curFatKg != null ? (curFatKg - perDay*daysTo) / projW * 100 : null;
    let eta = '-', gap = '';
    if (R <= 0) eta = '목표 달성';
    else if (perDay > 0) { const dd = Math.ceil(R/perDay), e = addDays(today, dd); eta = e; const late = Math.round((parse(e) - parse(DATA.targetDate))/864e5); gap = late > 0 ? `<span class="red">목표일보다 ${late}일 늦음</span>` : `<span class="k">목표일보다 ${-late}일 빠름</span>`; }
    else eta = '적자 없음';
    h += `<div class="box"><div><b>[PREDICT]</b> 현재 페이스로 계산 <span style="color:#999">(추정)</span></div>
    <table><tr><td class="l">최근 7일 평균 적자</td><td>${defi>=0?'−':'+'}${fmt(Math.abs(defi))} kcal/일</td></tr>
    <tr><td class="l">일 감량 속도</td><td>${(perDay*1000).toFixed(0)} g/일 · ${(perDay*7).toFixed(2)} kg/주</td></tr>
    <tr><td class="l">목표 체중 (제지방 ${f1(lean)}kg 유지)</td><td>${f1(tw)} kg</td></tr>
    <tr><td class="l">남은 감량</td><td>${R>0?f1(R)+' kg':'0 kg'}</td></tr>
    <tr><td class="l">목표 도달 예상일</td><td>${eta}</td></tr>
    <tr><td class="l">${DATA.targetDate} 예상 체중</td><td>${f1(projW)} kg${projFat!=null?' · 체지방 '+f1(projFat)+'%':''}</td></tr></table>${gap?`<div>${gap}</div>`:''}
    <div class="legend">적자 = 유지 ${fmt(DATA.maintenance)} − 순섭취. 7,700 kcal = 지방 1kg 기준 단순 추정이며, 근육·수분 변화는 반영하지 않습니다.</div></div>`;
  }
  // 기록 표
  h += `<table><tr><th class="l">날짜</th><th>체중</th><th>체지방%</th><th>골격근</th><th>변화</th></tr>` +
    B.slice().reverse().map((r, i, arr) => { const prev = arr[i+1], dw = prev && r.weight != null && prev.weight != null ? r.weight - prev.weight : null;
      return `<tr><td class="l">${dayLabel(r.d)}</td><td>${f1(r.weight)}</td><td>${f1(r.fatPct)}</td><td>${f1(r.muscleKg)}</td><td class="${dw==null?'':dw<=0?'k':'red'}">${dw==null?'-':(dw>0?'+':'')+dw.toFixed(1)}</td></tr>`; }).join('') + '</table>';
  return h;
}

function render(){ $('#view').innerHTML = {day:viewDay, week:viewWeek, month:viewMonth, trend:viewTrend, body:viewBody}[S.tab](); setHash(); }
</script>
</body>
</html>
