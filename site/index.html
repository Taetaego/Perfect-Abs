<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<title>Diet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c10'/%3E%3Cpath d='M7 22V10h5.5a4 4 0 010 8H7' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 읽기 쉬운 한 컬럼. 순서: 칼로리(1순위) → 단백질(2순위) → 탄수화물·지방 → 추이 */
:root{
  --bg:#0b0c10; --card:#15171e; --card2:#1d2029; --line:#2b2f3b;
  --fg:#ffffff; --sub:#c3c9d6; --mut:#9aa2b3;
  --kcal:#ffffff; --good:#3ddc97; --over:#ff7a45;
  --pro:#6c9bff; --carb:#ffbf3c; --fat:#ff6fb5;
  --num:"Archivo","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:500 16px/1.5 var(--body)}
body{padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.n{font-family:var(--num);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.logo{font:900 20px/1 var(--num);letter-spacing:.04em}
.bar{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.tabs{flex:1;display:flex;gap:5px}
.tabs button{flex:1;border:0;background:var(--card);color:var(--sub);font:700 13.5px var(--body);padding:7px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--fg);color:#000}

.nav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:8px;margin:8px 0 8px}
.nav button{height:36px;border-radius:10px;border:0;background:var(--card);color:var(--fg);font:700 18px var(--body);cursor:pointer}
.nav button:disabled{opacity:.25}
.nav .t{text-align:center}
.nav .t b{display:block;font:900 17px/1.2 var(--num)}
.nav .t span{font-size:12px;color:var(--sub)}

.card{background:var(--card);border-radius:16px;padding:6px 14px;margin-bottom:10px}
.h{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px;font-size:15px;font-weight:700;color:var(--sub)}
.chip{font-size:14px;font-weight:700;padding:3px 12px;border-radius:99px;background:var(--card2);color:var(--fg)}
.chip.good{background:rgba(61,220,151,.16);color:var(--good)}
.chip.over{background:rgba(255,122,69,.18);color:var(--over)}

/* 큰 숫자 카드 */
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font:900 76px/1 var(--num);letter-spacing:-.03em}
.big span{font-size:20px;font-weight:700;color:var(--sub)}
.big.sm b{font-size:52px}
.big.sm span{font-size:17px}
.track{position:relative;height:18px;border-radius:9px;background:var(--card2);margin:16px 0 14px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.track s{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;opacity:.9}
.track.slim{height:12px;margin:10px 0 0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.trio div span{display:block;font-size:14px;color:var(--sub)}
.trio div b{display:block;font:800 22px/1.25 var(--num)}


.item{padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item .l1 span{font-weight:800}
.item .l1 b{font-weight:900}
.item .l1 small{font:600 14px var(--body);color:var(--sub);margin-left:5px;letter-spacing:0}
.item .bar{position:relative;border-radius:99px;background:var(--card2);margin:5px 0 4px;overflow:hidden}
.item .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.item .bar s{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff}
.item .l3{font-size:15px}
.item .l3 b{font-weight:900}
.item.xl .l1 span{font-size:18px}.item.xl .l1 b{font-size:28px}.item.xl .bar{height:16px}.item.xl .l3{font-size:14px}
.item.lg .l1 span{font-size:16px}.item.lg .l1 b{font-size:22px}.item.lg .bar{height:13px}.item.lg .l3{font-size:13.5px}
.item.md .l1 span{font-size:14px}.item.md .l1 b{font-size:18px}.item.md .bar{height:10px}.item.md .l3{font-size:13px}
.carry{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--line);padding:8px 0 4px;margin-top:0;font-size:14px;font-weight:700}
.carry b{display:block;font-size:17px;margin-top:0}
.carry small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
/* 탄수화물·지방(구) */
.mrow{padding:14px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0;padding-top:4px}
.mrow .l{display:flex;justify-content:space-between;align-items:baseline}
.mrow .l span{font-size:16px;font-weight:700}
.mrow .l b{font:800 20px var(--num)}
.mrow .l b small{font:600 14px var(--body);color:var(--sub);margin-left:4px}
.mrow .r{font-size:14px;color:var(--sub);margin-top:6px}

/* 주간·월간 요약 */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sum .card{margin:0;padding:16px}
.sum .card span{display:block;font-size:14px;color:var(--sub);font-weight:700}
.sum .card b{display:block;font:900 34px/1.15 var(--num);margin:4px 0 2px}
.sum .card em{font-style:normal;font-size:13px;color:var(--sub)}

svg.chart{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}
svg.chart text{font:600 12px var(--body);fill:var(--sub)}
svg.chart .val{fill:#fff;font-weight:800;font-size:13px}
svg.chart .g{stroke:#2b2f3b;stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.legend u{display:inline-block;width:18px;border-top:3px dashed #fff;margin-right:6px;vertical-align:3px}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .w{font-size:13px;font-weight:700;color:var(--sub);text-align:center;padding-bottom:4px}
.cell{position:relative;min-height:66px;border-radius:12px;background:var(--card2);border:0;color:#fff;padding:6px 6px 0;text-align:left;font-family:var(--num);overflow:hidden;cursor:pointer}
.cell.blank{background:none;cursor:default}
.cell.none{background:transparent;border:1px dashed var(--line);cursor:default}
.cell .d{display:block;font:600 12px var(--body);color:var(--sub)}
.cell .k{display:block;font-size:15px;font-weight:800;margin-top:3px;letter-spacing:-.03em}
.cell .p{position:absolute;left:6px;right:6px;bottom:6px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.cell .p i{display:block;height:100%;background:var(--pro)}
.cell.lo{background:#1d3257}.cell.ok{background:#16422f}.cell.hi{background:#59301d}
.cell.today{box-shadow:inset 0 0 0 2px #fff}

.empty-state{padding:48px 0;text-align:center;color:var(--sub)}
footer{margin-top:22px;text-align:center;font-size:13px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s ease}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo">DIET</div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="day" aria-selected="true">일간</button>
      <button role="tab" data-t="week" aria-selected="false">주간</button>
      <button role="tab" data-t="month" aria-selected="false">월간</button>
      <button role="tab" data-t="trend" aria-selected="false">추이</button>
    </div>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="wrap" id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const dayLabel = s => { const d = parse(s); return `${d.getMonth()+1}.${d.getDate()}`; };

let DATA, BY = {}, GOAL, DD = '';
const S = { tab:'day', date:null, week:null, month:null };
const firstD = () => DATA.days[0].d, lastD = () => DATA.days[DATA.days.length-1].d;
const live = x => x.d === lastD() && x.d === iso(new Date());      // 오늘 진행 중인 날
const fin = a => { const f = a.filter(x => !live(x)); return f.length ? f : a; };

fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(d => {
  DATA = d; GOAL = d.goal; d.days.forEach(x => BY[x.d] = x);
  S.date = lastD(); S.week = mondayOf(S.date); S.month = S.date.slice(0,7);
  const left = Math.ceil((parse(d.targetDate) - new Date(new Date().toDateString())) / 864e5);
  DD = `D-${Math.max(0,left)} 복근`;
  $('#foot').textContent = `업데이트 ${d.updated.replace('T',' ').slice(0,16)}`;
  render();
}).catch(() => { $('#view').innerHTML = '<div class="empty-state">데이터를 불러오지 못했습니다.</div>'; });

function syncTabs(){ document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', x.dataset.t === S.tab)); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; syncTabs(); render(); scrollTo({top:0}); });
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  if (a === 'day') { S.date = v; S.tab = 'day'; syncTabs(); scrollTo({top:0}); }
  if (a === 'dnav') S.date = addDays(S.date, +v);
  if (a === 'week') S.week = addDays(S.week, +v*7);
  if (a === 'month') { const d = parse(S.month+'-01'); d.setMonth(d.getMonth()+ +v); S.month = iso(d).slice(0,7); }
  render();
});

/* ---------- 공통 조각 ---------- */
// 채팅 대시보드와 같은 3줄 형식: 항목·수치 / 바 / 퍼센트 · 남음. 순서는 칼로리 → 단백질 → 탄수화물 → 지방.
function item(icon, name, v, goal, unit, size, more){
  const pct = v/goal*100, left = goal - v, over = left < 0 && !more;
  const scale = Math.max(v, goal), col = more ? 'var(--pro)' : over ? 'var(--over)' : 'var(--good)';
  return `<div class="item ${size}"><div class="l1"><span>${icon} ${name}</span><b class="n">${fmt(v)}<small>/ ${fmt(goal)} ${unit}</small></b></div>
  <div class="bar"><i style="width:${clamp(v/scale*100,0,100)}%;background:${col}"></i>${left<0?`<s style="left:${goal/scale*100}%"></s>`:''}</div>
  <div class="l3" style="color:${over?'var(--over)':'var(--sub)'}"><b>${fmt(pct)}%</b> · ${more&&left<0?'달성 +':over?'초과 ':'남음 '}${fmt(Math.abs(left))}${unit}</div></div>`;
}
function dash(o, title, tag){
  return `<section class="card">${title?`<div class="h"><span>${title}</span>${tag?`<span class="chip">${tag}</span>`:''}</div>`:''}
  ${item('🔥','칼로리', o.kcal, o.kGoal, 'kcal', 'xl')}${item('🍗','단백질', o.p, GOAL.protein, 'g', 'lg', true)}
  ${item('🍚','탄수화물', o.c, o.cGoal, 'g', 'md')}${item('🥑','지방', o.f, GOAL.fat, 'g', 'md')}
  ${o.carry!=null?`<div class="carry"><div>⚠️ 초과 <b class="n">${fmt(o.over)}kcal</b></div><div>📦 누적 <b class="n">${fmt(o.carry)}kcal</b><small>초과 ${fmt(o.over)} + 쌓인 것 ${fmt(o.carry-o.over)}</small></div></div>`:''}</section>`;
}
function dayObj(d){ return {kcal:d.net, kGoal:d.goal, p:d.protein, c:d.carb, cGoal:d.carbGoal, f:d.fat, over:d.over, carry:d.carry}; }
function avgObj(a){ return {kcal:avg(a.map(x=>x.net)), kGoal:avg(a.map(x=>x.goal)), p:avg(a.map(x=>x.protein)), c:avg(a.map(x=>x.carb)), cGoal:avg(a.map(x=>x.carbGoal)), f:avg(a.map(x=>x.fat))}; }
function miniStats(a, digits){
  const defi = a.reduce((s,x)=>s+(2200-x.net),0);
  return `<section class="card"><div class="trio"><div><span>누적 적자</span><b class="n">${defi>=0?'−':'+'}${fmt(Math.abs(defi))}</b></div><div><span>추정 감량</span><b class="n">${(defi/7700).toFixed(digits)}kg</b></div><div><span>기록</span><b class="n">${a.length}일</b></div></div></section>`;
}

function barsChart({vals, goals, labels, color, h=190, hi=-1, onclick}){
  const W = 340, top = 26, bot = 26, n = vals.length;
  const mx = Math.max(...vals.filter(v=>v!=null), ...goals.filter(v=>v!=null), 1) * 1.08;
  const y = v => top + (h-top-bot) * (1 - v/mx);
  const bw = W/n, w = Math.min(36, bw*.66);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}"><line class="g" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>`;
  vals.forEach((v,i) => {
    const cx = i*bw + bw/2, x = cx - w/2, g = goals[i];
    if (v != null && v > 0) {
      s += `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0)-y(v)}" rx="7" fill="${color(v,i)}" ${onclick?`data-act="day:${onclick[i]}" style="cursor:pointer"`:''}/>`;
      s += `<text class="val" x="${cx}" y="${Math.min(y(v), g!=null?y(g):99)-7}" text-anchor="middle">${fmt(v)}</text>`;
    }
    if (g != null) s += `<line x1="${x-4}" x2="${x+w+4}" y1="${y(g)}" y2="${y(g)}" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 3"/>`;
    s += `<text x="${cx}" y="${h-6}" text-anchor="middle" ${i===hi?'style="fill:#fff;font-weight:800"':''}>${labels[i]}</text>`;
  });
  return s + '</svg>';
}

function lineChart(series, {h=200, goal=null}={}){
  const W = 340, pl = 40, pr = 8, top = 14, bot = 28, n = series[0].v.length;
  const all = series.flatMap(q => q.v.filter(v => v!=null)).concat(goal ? [goal] : []);
  const mx = Math.ceil(Math.max(...all, 1)*1.1/500)*500;
  const x = i => pl + (n===1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(n-1));
  const y = v => top + (h-top-bot)*(1-v/mx);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${h}">`;
  for (let k=0;k<=2;k++){ const v = mx*k/2; s += `<line class="g" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`; }
  if (goal) s += `<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="#fff" stroke-width="2" stroke-dasharray="6 4"/>`;
  series.forEach(q => {
    const pts = q.v.map((v,i)=> v==null?null:[x(i),y(v)]).filter(Boolean);
    if (!pts.length) return;
    s += `<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${q.color}" stroke-width="${q.w||3}" stroke-linecap="round" stroke-linejoin="round" ${q.thin?'opacity=".5"':''}/>`;
    if (q.dots) pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${q.color}" opacity=".7"/>`);
    const lp = pts[pts.length-1]; s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="6" fill="${q.color}" stroke="var(--card)" stroke-width="3"/>`;
  });
  const lab = series[0].labels, idx = n<=5 ? [...Array(n).keys()] : [0, Math.floor((n-1)/2), n-1];
  idx.forEach(i => s += `<text x="${x(i)}" y="${h-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${lab[i]}</text>`);
  return s + '</svg>';
}
const kcalColor = (v, goal) => v > goal ? 'var(--over)' : 'var(--good)';
const legendBar = `<div class="legend"><span><i style="background:var(--good)"></i>목표 이내</span><span><i style="background:var(--over)"></i>초과</span><span><u></u>그날 목표</span></div>`;

/* ---------- 일간 ---------- */
function viewDay(){
  const d = BY[S.date], dt = parse(S.date), idx = DATA.days.findIndex(x => x.d === S.date);
  let h = `<div class="nav"><button data-act="dnav:-1" ${idx>0?'':'disabled'} aria-label="이전 날">‹</button>
    <div class="t"><b>${dt.getMonth()+1}월 ${dt.getDate()}일 (${WD[dt.getDay()]})</b><span>${live(d)?'오늘 · 진행 중':'기록 완료'}${d.burn?` · 운동 −${fmt(d.burn)}kcal`:''} · ${DD}</span></div>
    <button data-act="dnav:1" ${idx<DATA.days.length-1?'':'disabled'} aria-label="다음 날">›</button></div>`;
  h += dash(dayObj(d));
  const w = DATA.days.slice(Math.max(0, idx-6), idx+1), lb = w.map(x=>dayLabel(x.d)), on = w.map(x=>x.d);
  h += `<section class="card"><div class="h"><span>최근 7일 칼로리 (순섭취)</span></div>${barsChart({vals:w.map(x=>x.net), goals:w.map(x=>x.goal), labels:lb, color:(v,i)=>kcalColor(v,w[i].goal), hi:w.length-1, onclick:on})}${legendBar}</section>`;
  h += `<section class="card"><div class="h"><span>최근 7일 단백질 (g)</span></div>${barsChart({vals:w.map(x=>x.protein), goals:w.map(()=>GOAL.protein), labels:lb, color:()=>'var(--pro)', hi:w.length-1, onclick:on})}<div class="legend"><span><u></u>목표 ${GOAL.protein}g</span></div></section>`;
  return h;
}

/* ---------- 주간: 최근 7일 ---------- */
function viewWeek(){
  const end = lastD(), days = [...Array(7).keys()].map(i => addDays(end, i-6));
  const rows = days.map(s => BY[s] || null), have = rows.filter(Boolean), wl = days.map(s=>WD[parse(s).getDay()]);
  let h = `<div class="nav" style="grid-template-columns:1fr"><div class="t"><b>최근 7일</b><span>${dayLabel(days[0])} – ${dayLabel(days[6])} · ${have.length}일 기록${have.some(live)?' · 오늘 제외 평균':''}</span></div></div>`;
  if (!have.length) return h + '<div class="empty-state">기록이 없습니다.</div>';
  const fh = fin(have);
  h += dash(avgObj(fh), '일평균', `${fh.length}일 기준`);
  h += miniStats(fh, 2);
  h += `<section class="card"><div class="h"><span>일별 칼로리 (순섭취)</span></div>${barsChart({vals:rows.map(x=>x?x.net:null), goals:rows.map(x=>x?x.goal:null), labels:wl, color:(v,i)=>kcalColor(v,rows[i].goal), hi:6, onclick:days})}${legendBar}</section>`;
  h += `<section class="card"><div class="h"><span>일별 단백질 (g)</span></div>${barsChart({vals:rows.map(x=>x?x.protein:null), goals:rows.map(x=>x?GOAL.protein:null), labels:wl, color:()=>'var(--pro)', hi:6, onclick:days})}<div class="legend"><span><u></u>목표 ${GOAL.protein}g</span></div></section>`;
  return h;
}

/* ---------- 월간: 최근 30일 ---------- */
function viewMonth(){
  const end = lastD(), days = [...Array(30).keys()].map(i => addDays(end, i-29));
  const md = days.map(s => BY[s]).filter(Boolean);
  let h = `<div class="nav" style="grid-template-columns:1fr"><div class="t"><b>최근 30일</b><span>${dayLabel(days[0])} – ${dayLabel(days[29])} · ${md.length}일 기록${md.some(live)?' · 오늘 제외 평균':''}</span></div></div>`;
  if (!md.length) return h + '<div class="empty-state">기록이 없습니다.</div>';
  const fm = fin(md);
  h += dash(avgObj(fm), '일평균', `${fm.length}일 기준`);
  h += miniStats(fm, 1);
  let cal = '<div class="cal">' + WD.map(w=>`<div class="w">${w}</div>`).join('') + '<div class="cell blank"></div>'.repeat(parse(days[0]).getDay());
  days.forEach((s,i) => {
    const x = BY[s], dd = parse(s), lab = (i===0 || dd.getDate()===1) ? `${dd.getMonth()+1}/${dd.getDate()}` : dd.getDate();
    if (!x) { cal += `<div class="cell none"><span class="d">${lab}</span></div>`; return; }
    const r = x.net/x.goal, cls = r>1.03 ? 'hi' : r<.85 ? 'lo' : 'ok';
    cal += `<button class="cell ${cls} ${live(x)?'today':''}" data-act="day:${s}"><span class="d">${lab}</span><span class="k">${fmt(x.net)}</span><span class="p"><i style="width:${clamp(x.protein/GOAL.protein*100,0,100)}%"></i></span></button>`;
  });
  h += `<section class="card"><div class="h"><span>달력 · 순섭취 kcal</span></div>${cal}</div>
    <div class="legend"><span><i style="background:#1d3257"></i>목표 85% 미만</span><span><i style="background:#16422f"></i>목표 근처</span><span><i style="background:#59301d"></i>초과</span><span><i style="background:var(--pro)"></i>아래 바 = 단백질</span></div></section>`;
  const lb = days.map(dayLabel);
  h += `<section class="card"><div class="h"><span>일별 칼로리 추이</span></div>${lineChart([{v:days.map(s=>BY[s]?BY[s].net:null), color:'#fff', dots:true, labels:lb}], {goal:GOAL.kcal})}<div class="legend"><span><u></u>목표 ${fmt(GOAL.kcal)}</span></div></section>`;
  h += `<section class="card"><div class="h"><span>일별 단백질 추이 (g)</span></div>${lineChart([{v:days.map(s=>BY[s]?BY[s].protein:null), color:'var(--pro)', dots:true, labels:lb}], {goal:GOAL.protein})}<div class="legend"><span><u></u>목표 ${GOAL.protein}g</span></div></section>`;
  return h;
}

/* ---------- 추이 ---------- */
function ma(arr, k=7){ return arr.map((_,i)=> avg(arr.slice(Math.max(0,i-k+1), i+1))); }
function viewTrend(){
  const ds = DATA.days, labels = ds.map(x=>dayLabel(x.d)), L = live(ds[ds.length-1]) ? 1 : 0;
  const net = ds.map(x=>x.net), pro = ds.map(x=>x.protein);
  const maF = a => ma(a.slice(0, a.length-L)).concat(Array(L).fill(null)), last = a => a.filter(v=>v!=null).pop();
  const net7 = maF(net), pro7 = maF(pro);
  let h = `<div class="nav" style="grid-template-columns:1fr"><div class="t"><b>전체 추이</b><span>${dayLabel(ds[0].d)} – ${dayLabel(ds[ds.length-1].d)} · ${ds.length}일</span></div></div>`;
  const k = last(net7), kc = k>GOAL.kcal ? 'var(--over)' : 'var(--good)';
  h += `<section class="card"><div class="h"><span>칼로리 · 최근 7일 평균 (순섭취)</span><span class="chip ${k>GOAL.kcal?'over':'good'}">목표 ${fmt(GOAL.kcal)}</span></div>
    <div class="big"><b class="n" style="color:${kc}">${fmt(k)}</b><span>kcal</span></div>
    ${lineChart([{v:net, color:'#fff', w:2, thin:true, dots:true, labels}, {v:net7, color:kc, w:4, labels}], {goal:GOAL.kcal})}
    <div class="legend"><span><i style="background:${kc}"></i>7일 평균</span><span><i style="background:#fff;opacity:.5"></i>일별</span><span><u></u>목표</span></div></section>`;
  h += `<section class="card"><div class="h"><span>단백질 · 최근 7일 평균</span><span class="chip">목표 ${GOAL.protein}g</span></div>
    <div class="big sm"><b class="n" style="color:var(--pro)">${fmt(last(pro7))}</b><span>g</span></div>
    ${lineChart([{v:pro, color:'#fff', w:2, thin:true, dots:true, labels}, {v:pro7, color:'var(--pro)', w:4, labels}], {goal:GOAL.protein})}
    <div class="legend"><span><i style="background:var(--pro)"></i>7일 평균</span><span><i style="background:#fff;opacity:.5"></i>일별</span><span><u></u>목표</span></div></section>`;
  h += `<section class="card"><div class="h"><span>탄수화물 · 지방 (g)</span></div>${lineChart([{v:ds.map(x=>x.carb), color:'#ffbf3c', labels}, {v:ds.map(x=>x.fat), color:'#ff6fb5', labels}])}
    <div class="legend"><span><i style="background:#ffbf3c"></i>탄수화물</span><span><i style="background:#ff6fb5"></i>지방</span></div></section>`;
  return h;
}

function render(){ $('#view').innerHTML = {day:viewDay, week:viewWeek, month:viewMonth, trend:viewTrend}[S.tab](); }
</script>
