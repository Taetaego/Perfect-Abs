<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Diet</title>
<link rel="icon" href="data:,">
<style>
/* 옛날 HTML 느낌: 검정 바탕, 기본 글꼴(맑은 고딕/굴림), 글자 막대, 선 표, 밑줄 링크. 장식 없음. */
:root{--bg:#000;--fg:#ddd;--w:#fff;--y:#ff0;--r:#f33;--b:#6cf;--e:#3a3a3a;--line:#777}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Malgun Gothic","맑은 고딕","Gulim","굴림체","Noto Sans KR",sans-serif}
body{padding:8px 10px calc(30px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-size:20px;margin:4px 0;color:var(--w);letter-spacing:.1em}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
b{color:var(--w)}
.lnk{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--b);text-decoration:underline;cursor:pointer}
.lnk.on{color:#000;background:var(--w);text-decoration:none;padding:0 2px}
.lnk:disabled{color:#555;text-decoration:none;cursor:default}
.tabs{margin:4px 0}
.date{margin:6px 0;text-align:center}
.item{margin:10px 0}
.l1{display:flex;justify-content:space-between;gap:8px}
.bar{font:12px/1.1 "Gulim","굴림체","Courier New",monospace;white-space:pre;letter-spacing:0;margin:3px 0;overflow:hidden}
.bar .f{color:var(--w)}.bar .e{color:var(--e)}.bar .o{color:var(--r)}.bar .p{color:var(--y)}.bar .m{color:var(--w)}
.red{color:var(--r)}.yel{color:var(--y)}
.pro{color:var(--y)}
table{border-collapse:collapse;width:100%;margin:6px 0}
th,td{border:1px solid var(--line);padding:2px 6px;text-align:right;font-weight:400}
th{color:var(--w);text-align:center}
td.l,th.l{text-align:left}
.box{border:1px solid var(--line);padding:4px 8px;margin:8px 0}
.row{display:flex;gap:6px;align-items:center;margin:1px 0}
.row .lb{width:38px;flex:none}
.row .bar{flex:1;margin:0}
.row .v{width:46px;flex:none;text-align:right}
.legend{color:#999;font-size:12px;margin-top:4px}
.empty{padding:30px 0;text-align:center;color:#999}
footer{margin-top:14px;color:#777;font-size:12px;text-align:center}
</style>
</head>
<body>
<h1>DIET</h1>
<div class="tabs" id="tabs">
  <button class="lnk on" data-t="day">[일간]</button>
  <button class="lnk" data-t="week">[주간]</button>
  <button class="lnk" data-t="month">[월간]</button>
  <button class="lnk" data-t="trend">[추이]</button>
</div>
<hr>
<main id="view"></main>
<footer id="foot"></footer>

<script>
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const WD = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const dayLabel = s => { const d = parse(s); return `${d.getMonth()+1}.${d.getDate()}`; };

let DATA, BY = {}, GOAL, DD = '';
const S = { tab:'day', date:null };
const lastD = () => DATA.days[DATA.days.length-1].d;
const live = x => x.d === lastD() && x.d === iso(new Date());   // 오늘 진행 중
const fin = a => { const f = a.filter(x => !live(x)); return f.length ? f : a; };

fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(d => {
  DATA = d; GOAL = d.goal; d.days.forEach(x => BY[x.d] = x);
  S.date = lastD();
  const left = Math.ceil((parse(d.targetDate) - new Date(new Date().toDateString())) / 864e5);
  DD = `D-${Math.max(0,left)} 복근`;
  $('#foot').textContent = `업데이트 ${d.updated.replace('T',' ').slice(0,16)}`;
  render();
}).catch(() => { $('#view').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>'; });

function syncTabs(){ document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab)); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; syncTabs(); render(); scrollTo({top:0}); });
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const [a, v] = b.dataset.act.split(':');
  if (a === 'day') { S.date = v; S.tab = 'day'; syncTabs(); scrollTo({top:0}); }
  if (a === 'dnav') S.date = addDays(S.date, +v);
  render();
});

/* ---------- 글자 막대 ---------- */
// 목표 = W칸. 넘으면 최대 2W칸까지 길어지고, 목표 지점에 | 표시.
function bar(v, goal, kind, W=22){
  const n = Math.round(W*v/goal), N = clamp(Math.max(W,n), W, 2*W), over = v > goal;
  const cls = kind === 'pro' ? 'p' : over ? 'o' : 'f';
  let s = '';
  for (let i=0;i<N;i++){
    if (i === W && N > W) s += '<span class="m">|</span>';
    s += `<span class="${i<n?cls:'e'}">${i<n?'█':'░'}</span>`;
  }
  return s;
}
function item(tag, name, v, goal, unit, kind){
  const pct = v/goal*100, left = goal - v;
  const msg = kind==='pro' && left<0 ? `달성 +${fmt(-left)}${unit}` : left<0 ? `초과 ${fmt(-left)}${unit}` : `남음 ${fmt(left)}${unit}`;
  const c = kind==='pro' ? 'yel' : left<0 ? 'red' : '';
  return `<div class="item"><div class="l1"><b class="${kind==='pro'?'pro':''}">[${tag}] ${name}</b><span><b>${fmt(v)}</b> / ${fmt(goal)} ${unit}</span></div>
  <div class="bar">${bar(v, goal, kind)}</div><div class="${c}">${fmt(pct)}% · ${msg}</div></div>`;
}
function dash(o, title){
  return `<div class="box">${title?`<div>${title}</div>`:''}
  ${item('KCAL','칼로리', o.kcal, o.kGoal, 'kcal')}${item('PRO','단백질', o.p, GOAL.protein, 'g', 'pro')}
  ${item('CARB','탄수화물', o.c, o.cGoal, 'g')}${item('FAT','지방', o.f, GOAL.fat, 'g')}
  ${o.carry!=null?`<hr><div class="l1"><span><b class="${o.over>0?'red':''}">[OVER]</b> 초과</span><b class="${o.over>0?'red':''}">${fmt(o.over)}kcal</b></div>
  <div class="l1"><span><b>[SUM]</b> 누적 <span style="color:#999">(초과 ${fmt(o.over)} + 쌓인 것 ${fmt(o.carry-o.over)})</span></span><b>${fmt(o.carry)}kcal</b></div>`:''}</div>`;
}
const dayObj = d => ({kcal:d.net, kGoal:d.goal, p:d.protein, c:d.carb, cGoal:d.carbGoal, f:d.fat, over:d.over, carry:d.carry});
const avgObj = a => ({kcal:avg(a.map(x=>x.net)), kGoal:avg(a.map(x=>x.goal)), p:avg(a.map(x=>x.protein)), c:avg(a.map(x=>x.carb)), cGoal:avg(a.map(x=>x.carbGoal)), f:avg(a.map(x=>x.fat))});
function miniStats(a, digits){
  const defi = a.reduce((s,x)=>s+(2200-x.net),0);
  return `<table><tr><th>누적 적자</th><th>추정 감량</th><th>기록</th></tr><tr><td>${defi>=0?'−':'+'}${fmt(Math.abs(defi))}kcal</td><td>${(defi/7700).toFixed(digits)}kg</td><td>${a.length}일</td></tr></table>`;
}

// 날짜별 글자 막대: 한 줄에 날짜 / 막대 / 값
function rows({days, vals, goals, kind, W=16}){
  const mx = Math.max(...vals.filter(v=>v!=null), ...goals.filter(g=>g!=null), 1);
  return days.map((s,i) => {
    const v = vals[i], g = goals[i];
    if (v == null) return `<div class="row"><span class="lb">${dayLabel(s)}</span><span class="bar"><span class="e">${'░'.repeat(W)}</span></span><span class="v" style="color:#555">-</span></div>`;
    const n = Math.round(W*v/mx), gi = Math.round(W*g/mx), over = v > g;
    const cls = kind==='pro' ? 'p' : over ? 'o' : 'f';
    let b = '';
    for (let k=0;k<W;k++){ const ch = k===gi-1 ? '|' : (k<n?'█':'░'); b += `<span class="${k===gi-1?'m':(k<n?cls:'e')}">${ch}</span>`; }
    return `<a class="lnk" style="text-decoration:none;display:block;color:inherit" data-act="day:${s}"><div class="row"><span class="lb">${dayLabel(s)}</span><span class="bar">${b}</span><span class="v ${kind==='pro'?'yel':over?'red':''}">${fmt(v)}</span></div></a>`;
  }).join('');
}
const legendK = '<div class="legend">| = 그날 목표 · 흰색 = 목표 이내 · 빨강 = 초과</div>';
const legendP = '<div class="legend">| = 목표 170g · 노랑 = 단백질</div>';

/* ---------- 일간 ---------- */
function viewDay(){
  const d = BY[S.date], dt = parse(S.date), idx = DATA.days.findIndex(x => x.d === S.date);
  let h = `<div class="date"><button class="lnk" data-act="dnav:-1" ${idx>0?'':'disabled'}>[&lt;]</button>
    <b> ${S.date} (${WD[dt.getDay()]}) </b><button class="lnk" data-act="dnav:1" ${idx<DATA.days.length-1?'':'disabled'}>[&gt;]</button>
    <div style="color:#999;font-size:12px">${live(d)?'오늘 · 진행 중':'기록 완료'}${d.burn?` · 운동 −${fmt(d.burn)}kcal`:''} · ${DD}</div></div>`;
  h += dash(dayObj(d));
  const w = DATA.days.slice(Math.max(0, idx-6), idx+1), dd = w.map(x=>x.d);
  h += `<div class="box"><div>최근 7일 칼로리 (순섭취)</div>${rows({days:dd, vals:w.map(x=>x.net), goals:w.map(x=>x.goal), kind:'k'})}${legendK}</div>`;
  h += `<div class="box"><div>최근 7일 단백질 (g)</div>${rows({days:dd, vals:w.map(x=>x.protein), goals:w.map(()=>GOAL.protein), kind:'pro'})}${legendP}</div>`;
  return h;
}

/* ---------- 주간: 최근 7일 ---------- */
function viewWeek(){
  const end = lastD(), days = [...Array(7).keys()].map(i => addDays(end, i-6));
  const rs = days.map(s => BY[s] || null), have = rs.filter(Boolean);
  let h = `<div class="date"><b>최근 7일</b><div style="color:#999;font-size:12px">${dayLabel(days[0])} – ${dayLabel(days[6])} · ${have.length}일 기록${have.some(live)?' · 오늘 제외 평균':''}</div></div>`;
  if (!have.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const fh = fin(have);
  h += dash(avgObj(fh), `일평균 (${fh.length}일 기준)`) + miniStats(fh, 2);
  h += `<div class="box"><div>일별 칼로리 (순섭취)</div>${rows({days, vals:rs.map(x=>x?x.net:null), goals:rs.map(x=>x?x.goal:GOAL.kcal), kind:'k'})}${legendK}</div>`;
  h += `<div class="box"><div>일별 단백질 (g)</div>${rows({days, vals:rs.map(x=>x?x.protein:null), goals:days.map(()=>GOAL.protein), kind:'pro'})}${legendP}</div>`;
  return h;
}

/* ---------- 월간: 최근 30일 ---------- */
function viewMonth(){
  const end = lastD(), days = [...Array(30).keys()].map(i => addDays(end, i-29)), md = days.map(s=>BY[s]).filter(Boolean);
  let h = `<div class="date"><b>최근 30일</b><div style="color:#999;font-size:12px">${dayLabel(days[0])} – ${dayLabel(days[29])} · ${md.length}일 기록${md.some(live)?' · 오늘 제외 평균':''}</div></div>`;
  if (!md.length) return h + '<div class="empty">기록이 없습니다.</div>';
  const fm = fin(md);
  h += dash(avgObj(fm), `일평균 (${fm.length}일 기준)`) + miniStats(fm, 1);
  h += `<table><tr><th class="l">날짜</th><th>순섭취</th><th>목표</th><th>단백질</th></tr>` +
    md.slice().reverse().map(x => `<tr><td class="l"><a class="lnk" data-act="day:${x.d}">${dayLabel(x.d)}(${WD[parse(x.d).getDay()]})</a></td>
      <td class="${x.net>x.goal?'red':''}">${fmt(x.net)}</td><td>${fmt(x.goal)}</td><td class="${x.protein>=GOAL.protein*.95?'yel':''}">${fmt(x.protein)}</td></tr>`).join('') +
    `</table><div class="legend">빨강 = 목표 초과 · 노랑 = 단백질 목표 달성(95%↑)</div>`;
  return h;
}

/* ---------- 추이 ---------- */
function ma(arr, k=7){ return arr.map((_,i)=> avg(arr.slice(Math.max(0,i-k+1), i+1))); }
function viewTrend(){
  const ds = DATA.days.slice(-30), L = live(ds[ds.length-1]) ? 1 : 0, dd = ds.map(x=>x.d);
  const maF = a => ma(a.slice(0, a.length-L)).concat(Array(L).fill(null));
  const net7 = maF(ds.map(x=>x.net)), pro7 = maF(ds.map(x=>x.protein));
  let h = `<div class="date"><b>추이 (7일 평균)</b><div style="color:#999;font-size:12px">${dayLabel(dd[0])} – ${dayLabel(dd[dd.length-1])} · ${ds.length}일${L?' · 오늘 제외':''}</div></div>`;
  h += `<div class="box"><div>칼로리 7일 평균 (순섭취)</div>${rows({days:dd, vals:net7, goals:dd.map(()=>GOAL.kcal), kind:'k'})}<div class="legend">| = 목표 ${fmt(GOAL.kcal)}kcal</div></div>`;
  h += `<div class="box"><div>단백질 7일 평균 (g)</div>${rows({days:dd, vals:pro7, goals:dd.map(()=>GOAL.protein), kind:'pro'})}${legendP}</div>`;
  return h;
}

function render(){ $('#view').innerHTML = {day:viewDay, week:viewWeek, month:viewMonth, trend:viewTrend}[S.tab](); }
</script>
</body>
</html>
